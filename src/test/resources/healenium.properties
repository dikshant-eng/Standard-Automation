# Healenium Configuration

# Recovery tries count (how many times Healenium should try to heal a locator)
recovery-tries = 1

# Score cap (minimum similarity score for healed locator, from 0.0 to 1.0)
score-cap = 0.5

# Enable/disable heal
heal-enabled = true

# Server URL for healenium backend (for reporting)
# If you're running healenium locally with Docker, use: http://localhost:7878
# For now, we'll use file-based storage
serverHost = localhost
serverPort = 7878

# Report path
reportPath = target/healenium

# Enable screenshots
screenshotOnFail = true

# Enable healing for iframes
healingIframe = true

