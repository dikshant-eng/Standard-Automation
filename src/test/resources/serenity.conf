environment = "chrome"
environments {
    chrome {
        webdriver {
            driver = "chrome"

            timeouts {
                script = 30000
                pageLoad = 300000
                implicit = 15000
                fluent = 10000
            }

            capabilities {
                browserName = "chrome"
                acceptInsecureCerts = true
                browserVersion = "144.0.7559.97"

                "goog:chromeOptions" {
                    args = ["start-maximized", "test-type", "no-sandbox", "ignore-certificate-errors",
                    "disable-popup-blocking", "disable-default-apps",
                    "disable-extensions-file-access-check", "incognito", "disable-infobars",
                    "disable-gpu", "user-agent=Apache", "disable-dev-shm-usage", "window-size=1920,1080",
                    "enable-features=NetworkService"]
                }
            }
        }
    }

    firefox {
        webdriver {
            driver = "firefox"
            autodownload = true

            timeouts {
                script = 30000
                pageLoad = 300000
                implicit = 15000
                fluent = 10000
            }

            capabilities {
                browserName = "firefox"
                acceptInsecureCerts = true

                "moz:firefoxOptions" {
                    args = ["-private"],
                        prefs {
                            "browser.tabs.documentchannel.ppdc": false
                            "browser.tab.animated": false
                            "browser.panorama.animate_zoom": false
                            "network.dns.disablePrefetch": true
                            "network.prefetch-next": false
                            "network.http.speculative-parallel-limit": 0
                            "webgl.disabled": true
                            "network.http.pipelining": true
                            "network.http.proxy.pipelining": true
                            "network.http.pipelining.maxrequests": 8
                            "network.http.max-connections": 96
                            "network.http.max-connections-per-server": 32
                            "network.dns.disableIPv6": false
                            "plugin.expose_full_path": true
                            "nglayout.initialpaint.delay": 2
                            "fission.webContentIsolationStrategy": 0
                            "fission.bfcacheInParent": false
                        }
                }
            }
        }

        default {
            webdriver.base.url = "https://www.google.com"
        }
        all {
            home.page = "#{webdriver.base.url}"
            signin.page = "https://www.google.com"
        }
    }

    edge {
        webdriver {
            driver = "edge"

            timeouts {
                script = 30000
                pageLoad = 300000
                implicit = 15000
                fluent = 10000
            }

            capabilities {
                browserName = "MicrosoftEdge"
                acceptInsecureCerts = true

                "ms:edgeOptions" {
                    args = ["start-maximized", "test-type", "no-sandbox", "ignore-certificate-errors",
                    "disable-popup-blocking", "disable-default-apps",
                    "disable-extensions-file-access-check", "incognito", "disable-infobars",
                    "disable-gpu", "user-agent=Apache", "disable-dev-shm-usage", "window-size=1920,1080",
                    "enable-features=NetworkService"]
                }
            }
        }
    }

    with_screenshots {
        serenity {
          take.screenshots = BEFORE_AND_AFTER_EACH_STEP
        }
    }
}

drivers {
  windows {
    webdriver.chrome.driver = src/test/resources/drivers/windows/chromedriver.exe
    webdriver.edge.driver = src/test/resources/drivers/windows/msedgedriver.exe
  }
  mac {
    webdriver.chrome.driver = src/test/resources/drivers/mac/chromedriver
    webdriver.edge.driver = src/test/resources/drivers/mac/msedgedriver
  }
  linux {
    webdriver.chrome.driver = src/test/resources/drivers/linux/chromedriver
    webdriver.edge.driver = src/test/resources/drivers/linux/msedgedriver
  }
}

logging {
    level = DEBUG
}

shutterbug {
    capturestrategy = FULL
    betweenScrollTimeout = 100
    useDevicePixelRatio = true
}

serenity.take.screenshots=FOR_FAILURES
serenity.project.name="Serenity BDD"
serenity.requirement.types= "epic, feature"
serenity.browser.maximized = true

# Healenium Configuration - Self-Healing ENABLED
webdriver.driver = provided
webdriver.provided.type = com.SerenityBDD.config.HealeniumDriverManager
webdriver.provided.com.SerenityBDD.config.HealeniumDriverManager = com.SerenityBDD.config.HealeniumDriverManager